<!DOCTYPE html>
<html>
<head>
<title>Chess Engine</title>
<style>
  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin-top: 30px; }
  #board { display: grid; grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); border: 2px solid #333; }
  .square { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 36px; cursor: pointer; }
  .light { background: #eeeed2; }
  .dark { background: #769656; }
  .selected { outline: 3px solid #ffcc00; outline-offset: -3px; }
  #status { margin-top: 15px; font-size: 18px; }
  button { margin-top: 10px; padding: 6px 14px; }
</style>
</head>
<body>
<div id="board"></div>
<div id="status">White to move</div>
<button onclick="resetGame()">Reset</button>

<script>
const symbols = {
  P: "♙", N: "♘", B: "♗", R: "♖", Q: "♕", K: "♔",
  p: "♟", n: "♞", b: "♝", r: "♜", q: "♛", k: "♚"
};

let selected = null;
let currentSquares = [];

async function fetchBoard() {
  const res = await fetch("/api/board");
  const data = await res.json();
  render(data.squares, data.turn);
}

function render(squares, turn) {
  currentSquares = squares;
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const div = document.createElement("div");
      div.className = "square " + ((r + c) % 2 === 0 ? "light" : "dark");
      const piece = squares[r][c];
      if (piece) div.textContent = symbols[piece];
      if (selected && selected[0] === r && selected[1] === c) div.classList.add("selected");
      div.onclick = () => handleClick(r, c);
      board.appendChild(div);
    }
  }
  document.getElementById("status").textContent = (turn === "w" ? "White" : "Black") + " to move";
}

function handleClick(r, c) {
  if (!selected) {
    if (currentSquares[r][c] !== null) selected = [r, c];
    render(currentSquares, document.getElementById("status").textContent.includes("White") ? "w" : "b");
    return;
  }
  const from = selected;
  const to = [r, c];
  selected = null;
  sendMove(from, to);
}

async function sendMove(from, to) {
  const res = await fetch("/api/move", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ from, to })
  });
  const data = await res.json();
  if (data.error) {
    alert("Illegal move");
  }
  render(data.squares, data.turn);
}

async function resetGame() {
  const res = await fetch("/api/reset", { method: "POST" });
  const data = await res.json();
  selected = null;
  render(data.squares, data.turn);
}

fetchBoard();
</script>
</body>
</html>
